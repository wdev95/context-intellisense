name: Release VSIX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build VSIX (patch bump included)
        run: node build-vsix.js

      - name: Resolve version and VSIX file
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX_FILE=$(ls -t *.vsix | head -n 1)

          if [ -z "$VSIX_FILE" ]; then
            echo "No VSIX produced." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.meta.outputs.version }}"

      - name: Push commit and tag
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.vsix }}
            install-vsix.js
