name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.X.X)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate and set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the X.X.X format (for example 1.2.3)." >&2
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build VSIX
        run: npx --yes @vscode/vsce package --allow-missing-repository

      - name: Resolve version and VSIX file
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VSIX_FILE="context-intellisense-$VERSION.vsix"

          if [ ! -f "$VSIX_FILE" ]; then
            echo "Expected VSIX was not produced: $VSIX_FILE" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit selected version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${{ steps.meta.outputs.version }}"
          fi

      - name: Push commit and tag
        run: |
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.vsix }}
            install-vsix.js
